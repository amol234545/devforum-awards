<!doctype html>
<html lang="en">

<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <link rel="stylesheet" href="/themes/base.css">
  <link rel="stylesheet" href="/themes/categories.css">
  <script type="module" src="/components/Header.js"></script>
  <script type="module" src="/components/Navigation.js"></script>
  <script type="module" src="/components/CategoryList.js"></script>
  <script type="module">
    const response = await fetch("/assets/categories.json");
    const categories = await response.json();

    await customElements.whenDefined("category-list");
    document.querySelector("category-list").categories = categories;
  </script>
</head>

<body>
  <main class="page-shell">
    <h3 class="categories-intro">Everything here is shuffled every refresh!</h3>
    <category-list></category-list>
  </main>
  <app-navigation page="Categories"></app-navigation>
</body>

</html>
