<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <link rel="stylesheet" href="/themes/base.css">
  <link rel="stylesheet" href="/themes/voting.css">
  <script type="module" src="/components/Header.js"></script>
  <script type="module" src="/components/Navigation.js"></script>
  <script type="module" src="/components/VotingList.js"></script>
  <script type="module">
    import 'material/buttons/button.js';
    import 'material/icon/icon.js';
  </script>
</head>

<body>
  <main class="page-shell">
    <section class="vote-header">
      <div class="vote-heading">
        <h2>Vote for your...</h2>
        <h1>Best Devforum User!</h1>
      </div>
      <div class="vote-button-wrap">
        <md-button size="medium" color="tonal" has-icon trailing-icon>
          <md-icon slot="icon">star</md-icon>
          Vote!
        </md-button>
      </div>
    </section>
    <voting-list id="voting-list"></voting-list>
  </main>

  <script type="module">
    const list = document.querySelector("#voting-list");

    list.categories = [
      {
        id: "1",
        username: "User One",
        description: "Supporting text goes here",
        avatar: "./assets/avatar.png",
      },
      {
        id: "2",
        username: "User Two",
        description: "Supporting text goes here",
        avatar: "./assets/avatar.png",
      },
      {
        id: "3",
        username: "User Three",
        description: "Supporting text goes here",
        avatar: "./assets/avatar.png",
      },
      {
        id: "4",
        username: "User Four",
        description: "Supporting text goes here",
        avatar: "./assets/avatar.png",
      },
    ];

    list.addEventListener("vote-change", (event) => {
      console.log("Selected vote:", event.detail.selected);
    });
  </script>
  <app-navigation page="Voting"></app-navigation>
</body>
</html>
